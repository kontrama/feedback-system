<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F33dback</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="static/script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet"  type="text/css" href="{{url_for('static', filename='style.css')}}">
</head>
<body class="font-sans bg-gray-50 text-gray-800">

<body class="min-h-screen flex items-center justify-center bg-gray-50 font-sans">
 <center>   
    <!-- Фоновый градиент (как на главной) -->
    <div class="fixed inset-0 data-gradient opacity-10 -z-10"></div>
    
    <!-- Основной контейнер -->
    <div class="w-full max-w-md px-4 py-8">
        
        <!-- Карточка авторизации -->
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
            <i class="fa-regular fa-clipboard text-2xl text-blue-600"></i>
                        <div>
                        <h1 class="text-2xl font-bold">F33dback</h1>
                        <p class="text-gray-600 mt-2">Вход в личный кабинет</p>
            <!-- Заголовок -->
            <h2 class="text-2xl font-bold text-gray-800 mb-6 items-center">
                <i class="fas fa-lock text-blue-600 mr-2"></i>
                Авторизация
            </h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
            <!-- Форма входа -->
            <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <!-- Поле Email -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-envelope text-gray-400 mr-1"></i>
                        Email или Login
                    </label>
                    <input type="text" 
                            id="username" name="username" 
                           placeholder="user" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                           required>
                </div>
                
                <!-- Поле Пароль -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-key text-gray-400 mr-1"></i>
                        Пароль
                    </label>
                    <input type="password" 
                            id="password" name="password"
                           placeholder="••••••••" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition"
                           required>
                </div>
                
                <!-- Запомнить меня и Забыли пароль -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center space-x-2">
                        <input type="checkbox" name="remember" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                        <span class="text-sm text-gray-600">Запомнить меня</span>
                    </label>
                    <a href="/register" class="text-sm text-blue-600 hover:text-blue-800 hover:underline">
                        Зарегистрироваться
                    </a>
                </div>
                
                <!-- Кнопка входа -->
                <button type="submit" class="w-full data-gradient text-white py-3 rounded-lg font-medium hover:opacity-90 transition shadow-md hover:shadow-lg">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Войти
                </button>
            </form>
        </div>
        
        <!-- Ссылка на главную -->
        <div class="text-center mt-6">
            <a href="/" class="text-sm text-gray-500 hover:text-blue-600 transition">
                <i class="fas fa-arrow-left mr-1"></i>
                Вернуться на главную
            </a>
        </div>
    </div>
    </center>
</body>    
    
    
        <div class="text-center mt-8 text-xs text-gray-400">
                        <p>&copy; 2026 F33dback.</p>
        </div>
    

    <script src="static/anim.js"></script>
</body>
</html>
