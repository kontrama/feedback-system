<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>F33dback</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="static/script.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet"  type="text/css" href="{{url_for('static', filename='style.css')}}">
</head>
<body class="font-sans bg-gray-50 text-gray-800">
    <!-- Навигация -->
    <header class="data-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <!-- Логотип -->
                <div class="flex items-center space-x-3 mb-4 md:mb-0">
                    <div class="bg-white p-2 rounded-lg">
                        <i class="fa-regular fa-clipboard text-2xl text-blue-600"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold">F33dback</h1>
                        <p class="text-xs text-blue-200">Удобная система обратной связи</p>
                    </div>
                </div>
                
                <!-- Навигационные ссылки -->
                <div class="flex flex-wrap justify-center gap-4 md:gap-8">
                    <a href="/" class="px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">Главная</a>
                    <a href="/about" class="px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">О нас</a>
                </div>
            </div>
        </div>
    </header>

    <main class="py-8 px-4 sm:p-6 md:py-12 md:px-8">
        <div class="max-w-6xl mx-auto">
            <div class="text-center mb-12 animate-on-scroll">
                <h1 class="text-4xl md:text-5xl font-bold text-blue-900 mb-4">
                    Свяжитесь с нами
                </h1>
                <p class="text-xl text-gray-700 max-w-3xl mx-auto">
                    Готовы оставить хвалебный комментарий или же сообщить нам об ошибке?
                </p>
                <p class="text-xl text-gray-700 max-w-3xl mx-auto">
                    Оставьте ваш отзыв!
                </p>
            </div>

            <center><div class="animate-on-scroll">
                    <div class="bg-white rounded-2xl shadow-xl p-8">
                        
                        <form class="space-y-6" method="POST" action="{{ url_for('feedback_form') }}">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                                <div>
                                    <label for="name" class="block text-gray-700 font-medium mb-2">Имя</label>
                                    <input type="text" id="name" name="name" required value="{{ session.get('username', '') }}"
                                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 
                                           focus:ring-blue-500 focus:border-transparent">
                                </div>
                            
                            <div>
                                <label for="topic" class="block text-gray-700 font-medium mb-2">Категория отзыва</label>
                                <select id="topic" name="topic" required
                                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                                    <option value="" disabled selected>Категория отзыва</option>
                                    <option value="consultation">Положительный</option>
                                    <option value="partnership">Предложение</option>
                                    <option value="support">Ошибка</option>
                                    <option value="career">Негативный</option>
                                </select>
                            </div>
                            
                            <div>
                                <label for="message" class="block text-gray-700 font-medium mb-2">Сообщение</label>
                                <textarea id="message" name="message" rows="5" required
                                          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                                          placeholder="Опишите вашу задачу или вопрос"></textarea>
                            </div>
                            
                            <button type="submit" class="w-full data-gradient text-white text-lg font-semibold py-4 rounded-lg hover:shadow-xl transition-all duration-300">
                                <i class="fas fa-paper-plane mr-2"></i>Отправить отзыв
                            </button>
                        </form>
                    </div>
                </div></center>
            </div>
        </main>
        <footer class="bg-gray-900 text-white pt-12 pb-8">
            <div class="pt-8 border-t border-gray-800 text-center text-gray-500 text-sm">
                <p>&copy; 2026 F33dback.</p>
            </div>
        </footer>

    <script src="static/anim.js"></script>
</body>
</html>
